[project]
name = "airbyte-mcp"
version = "0.1.0"
description = "Read-only MCP server for self-hosted Airbyte OSS (public + internal APIs)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Nick Thomson" }]
dependencies = [
    "fastmcp>=3.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/NGRThomson/airbyte-oss-mcp"
Repository = "https://github.com/NGRThomson/airbyte-oss-mcp"

[project.scripts]
airbyte-mcp = "airbyte_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["airbyte_mcp"]
